<style>
:root{--bg:#0b0c10;--text:#eef0f6;--muted:#9aa0ae;--line:#23262f;--accent:#818cf8;--accent2:#22d3ee}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;
  background-image:radial-gradient(50rem 26rem at 90% -10%,rgba(129,140,248,.18),transparent),radial-gradient(40rem 24rem at -10% 5%,rgba(34,211,238,.12),transparent);background-repeat:no-repeat}
.wrap{max-width:1200px;margin:0 auto;padding:1.5rem 1rem 4rem}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem}
.back{color:var(--muted);text-decoration:none;font-weight:600;font-size:.95rem}
.back:hover{color:var(--text)}
h1{font-size:clamp(1.8rem,4vw,2.6rem);letter-spacing:-.03em;margin-bottom:.4rem}
h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);margin-bottom:1.75rem}
.video{border-radius:20px;overflow:hidden;border:1px solid var(--line);margin-bottom:1rem;background:#000}
.video video{display:block;width:100%;max-height:70vh}
.gallery{columns:3;column-gap:1rem}
.tile{break-inside:avoid;margin:0 0 1rem;border-radius:16px;overflow:hidden;background:#15171e;cursor:zoom-in;position:relative}
.tile.hero{column-span:all;margin-bottom:1rem}
.tile img{display:block;width:100%;height:auto;transition:transform .5s ease,filter .3s}
.tile:hover img{transform:scale(1.05)}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}
@media(max-width:900px){.gallery{columns:2}}
@media(max-width:560px){.gallery{columns:1}}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}.tile img{transition:none}}
.lb{position:fixed;inset:0;background:rgba(5,6,9,.94);display:none;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(6px)}
.lb.open{display:flex}
.lb img{max-width:92vw;max-height:88vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.lb button{position:absolute;background:rgba(255,255,255,.1);color:#fff;border:0;width:48px;height:48px;border-radius:50%;font-size:22px;cursor:pointer;transition:background .15s}
.lb button:hover{background:rgba(255,255,255,.22)}
.lb .x{top:1rem;right:1rem}.lb .p{left:1rem;top:50%}.lb .n{right:1rem;top:50%}
.lb .c{position:absolute;bottom:1rem;color:var(--muted);font-size:.85rem}
</style>

<div class="lb" id="lb" aria-modal="true" role="dialog">
  <button class="x" aria-label="Close">&times;</button>
  <button class="p" aria-label="Previous">&#8249;</button>
  <img id="lbimg" alt="">
  <button class="n" aria-label="Next">&#8250;</button>
  <div class="c" id="lbc"></div>
</div>

<script>
const imgs=[...document.querySelectorAll('.tile img')],lb=document.getElementById('lb'),lbi=document.getElementById('lbimg'),lbc=document.getElementById('lbc');
let cur=0;
function show(i){cur=(i+imgs.length)%imgs.length;lbi.src=imgs[cur].src;lbc.textContent=(cur+1)+' / '+imgs.length}
function open_(i){show(i);lb.classList.add('open');document.body.style.overflow='hidden'}
function close_(){lb.classList.remove('open');document.body.style.overflow=''}
imgs.forEach((im,i)=>im.parentElement.addEventListener('click',()=>open_(i)));
lb.querySelector('.x').onclick=close_;
lb.querySelector('.p').onclick=e=>{e.stopPropagation();show(cur-1)};
lb.querySelector('.n').onclick=e=>{e.stopPropagation();show(cur+1)};
lb.addEventListener('click',e=>{if(e.target===lb)close_()});
document.addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')close_();if(e.key==='ArrowLeft')show(cur-1);if(e.key==='ArrowRight')show(cur+1)});
let sx=0;lb.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
lb.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)show(cur+(d<0?1:-1))});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.08});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
</script>
